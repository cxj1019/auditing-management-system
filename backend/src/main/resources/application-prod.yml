spring:
  datasource:
    # 生产环境：Supabase 云服务或自托管 Supabase 均为 PostgreSQL，仅切换连接参数
    # Supabase Session Pooler 示例：
    #   DB_HOST=aws-0-<region>.pooler.supabase.com
    #   DB_PORT=5432
    #   DB_NAME=postgres
    #   DB_USER=postgres.<项目引用ID>
    #   DB_SSLMODE=require
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.accounting.firm: info
    root: warn
